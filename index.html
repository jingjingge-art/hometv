<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>种子扫描｜+20网段｜并发300｜最快200</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, Monaco, monospace;
            padding: 14px;
            margin: 0;
        }
        .wrap { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-size: 22px;
            color: #38bdf8;
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #374151;
            border-top: 3px solid #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .warn {
            background: #1f2937;
            border: 1px solid #ef4444;
            padding: 10px 12px;
            border-radius: 8px;
            color: #f87171;
            margin-bottom: 12px;
            line-height: 1.5;
            font-size: 13px;
        }
        .btn-area {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        button {
            padding: 9px 16px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.15s;
        }
        button:hover:not(:disabled) { opacity: 0.9; }
        button.sec { background: #374151; }
        button.danger { background: #dc2626; }
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .info {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 14px;
            margin-bottom: 8px;
            background: #1f2937;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .info b { color: #38bdf8; }
        #log {
            height: 380px;
            overflow-y: auto;
            background: #020617;
            border: 1px solid #1e293b;
            padding: 10px;
            border-radius: 6px;
            white-space: nowrap;
            font-size: 13px;
            line-height: 1.5;
        }
        #out {
            margin-top: 10px;
            background: #020617;
            border: 1px solid #1e293b;
            padding: 10px;
            border-radius: 6px;
            color: #22c55e;
            white-space: pre-wrap;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>
            种子扫描
            <span class="spinner" id="spinner"></span>
        </h1>
        <div class="warn">
            ⚠️ 每段 +20 个IP｜并发 300｜保留最快 200｜无固定超时，只筛选有效响应｜浏览器探测 ≠ 真实 ICMP ping｜仅限自有授权网络测试！
        </div>
        <div class="btn-area">
            <button id="start">开始扫描</button>
            <button id="pause" class="sec" disabled>暂停</button>
            <button id="stop" class="danger" disabled>停止</button>
            <button id="save" class="sec" disabled>下载 top200_fast_ip.txt</button>
        </div>
        <div class="info">
            <span>状态：<b id="status">等待</b></span>
            <span>进度：<b id="progress">0 / 0</b></span>
            <span>有效：<b id="hit">0</b></span>
            <span>最终：<b id="final">0</b></span>
            <span>耗时：<b id="elapsed">0.0s</b></span>
        </div>
        <div id="log"></div>
        <div id="out"></div>
    </div>

    <script>
        const CONFIG = {
            seedList: [
                [49, 45, 85, 225],
                [114, 95, 236, 32],
                [112, 61, 137, 11],
                [114, 55, 129, 132],
                [121, 232, 168, 204],
                [116, 189, 107, 107],
                [153, 170, 94, 182],
                [49, 49, 187, 254],
                [112, 50, 121, 75],
                [49, 59, 118, 61],
                [114, 76, 130, 7],
                [114, 150, 132, 28]
            ],
            portList: [
                80, 1234, 2233, 2345, 3344, 4455, 5555, 5566, 5678,
                6666, 6677, 7788, 8080, 8099, 8899, 9901, 9999,
                12345, 6888, 8188
            ],
            SEGMENT_STEP: 20,       // 每段往后加20个IP
            CONCURRENT: 300,        // 并发数
            KEEP_TOP: 200,          // 保留最快200个
            MAX_WAIT: 10000,        // 最长等待10秒，防止卡死
            MAX_LOG_LINES: 300
        };

        const dom = {
            log: document.getElementById("log"),
            status: document.getElementById("status"),
            progress: document.getElementById("progress"),
            hit: document.getElementById("hit"),
            final: document.getElementById("final"),
            elapsed: document.getElementById("elapsed"),
            out: document.getElementById("out"),
            spinner: document.getElementById("spinner"),
            start: document.getElementById("start"),
            pause: document.getElementById("pause"),
            stop: document.getElementById("stop"),
            save: document.getElementById("save")
        };

        let state = {
            queue: [],
            results: [],
            running: false,
            paused: false,
            done: 0,
            hitCount: 0,
            startTime: 0,
            total: 0
        };

        function log(msg, type = "info") {
            const t = new Date().toLocaleTimeString();
            const color = {
                info: "#94a3b8",
                ok: "#22c55e",
                err: "#f87171",
                warn: "#facc15"
            }[type] || "#94a3b8";
            dom.log.innerHTML += `<div style="color:${color}">[${t}] ${msg}</div>`;
            dom.log.scrollTop = dom.log.scrollHeight;
            trimLog();
        }

        function trimLog() {
            const lines = dom.log.children;
            if (lines.length > CONFIG.MAX_LOG_LINES) {
                while (lines.length > CONFIG.MAX_LOG_LINES) lines[0].remove();
            }
        }

        function updateUI() {
            dom.progress.textContent = `${state.done} / ${state.total}`;
            dom.hit.textContent = state.hitCount;
            dom.final.textContent = state.results.length;
            if (state.startTime) {
                dom.elapsed.textContent = `${((Date.now() - state.startTime) / 1000).toFixed(1)}s`;
            }
            dom.spinner.style.display = state.running && !state.paused ? "block" : "none";
            dom.start.disabled = state.running;
            dom.pause.disabled = !state.running;
            dom.stop.disabled = !state.running;
            dom.save.disabled = state.results.length === 0;
        }

        function generateIPs() {
            const ips = [];
            CONFIG.seedList.forEach(seed => {
                for (let i = 1; i <= CONFIG.SEGMENT_STEP; i++) {
                    const ip = `${seed[0]}.${seed[1]}.${seed[2]}.${seed[3] + i}`;
                    CONFIG.portList.forEach(port => {
                        ips.push({ ip, port, id: `${ip}:${port}` });
                    });
                }
            });
            return ips;
        }

        async function checkPort(item) {
            return new Promise(resolve => {
                const start = performance.now();
                const img = new Image();
                let resolved = false;

                function cleanup() {
                    if (resolved) return;
                    resolved = true;
                    img.onload = img.onerror = null;
                    try { delete img; } catch (e) {}
                }

                img.onload = img.onerror = function (e) {
                    cleanup();
                    const time = Math.round(performance.now() - start);
                    if (e.type === "error") {
                        resolve({ ...item, time, alive: true });
                    } else {
                        resolve({ ...item, time, alive: false });
                    }
                };

                img.src = `http://${item.ip}:${item.port}/?_t=${Date.now()}${Math.random()}`;
                
                // 防卡死保护，最长等待10秒
                setTimeout(() => {
                    if (!resolved) {
                        cleanup();
                        resolve({ ...item, time: CONFIG.MAX_WAIT, alive: false });
                    }
                }, CONFIG.MAX_WAIT);
            });
        }

        function sortAndTrim() {
            // 按响应时间升序，保留最快的KEEP_TOP个
            state.results.sort((a, b) => a.time - b.time);
            if (state.results.length > CONFIG.KEEP_TOP) {
                state.results = state.results.slice(0, CONFIG.KEEP_TOP);
            }
        }

        async function worker() {
            while (state.queue.length > 0 && state.running && !state.paused) {
                const item = state.queue.shift();
                if (!item) return;
                
                const result = await checkPort(item);
                state.done++;
                
                if (result.alive) {
                    state.hitCount++;
                    state.results.push(result);
                    sortAndTrim(); // 每次加入后立即排序裁剪
                    log(`✅ ${result.ip}:${result.port} - ${result.time}ms (前${state.results.length})`, "ok");
                }
                
                updateUI();
                await new Promise(r => setTimeout(r, 1));
            }
        }

        async function startScan() {
            if (state.running) return;
            
            state = {
                queue: [],
                results: [],
                running: true,
                paused: false,
                done: 0,
                hitCount: 0,
                startTime: Date.now(),
                total: 0
            };
            
            dom.log.innerHTML = "";
            dom.out.style.display = "none";
            
            log("🚀 生成扫描任务...", "info");
            state.queue = generateIPs();
            state.total = state.queue.length;
            
            log(`📋 共 ${state.total} 个地址待扫描｜并发 ${CONFIG.CONCURRENT}｜保留最快 ${CONFIG.KEEP_TOP}`, "info");
            dom.status.textContent = "扫描中";
            updateUI();
            
            const workers = [];
            for (let i = 0; i < CONFIG.CONCURRENT; i++) {
                workers.push(worker());
            }
            
            await Promise.all(workers);
            
            if (state.running) finishScan();
        }

        function finishScan() {
            state.running = false;
            dom.status.textContent = "已完成";
            dom.spinner.style.display = "none";
            
            log("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", "info");
            log(`🎉 扫描完成！有效：${state.hitCount}｜已保留最快 ${state.results.length} 个`, "ok");
            
            dom.out.style.display = "block";
            dom.out.textContent = state.results
                .map((r, i) => `${String(i + 1).padStart(3, ' ')}. ${r.ip}:${r.port} - ${r.time}ms`)
                .join("\n");
            
            updateUI();
        }

        function pauseScan() {
            state.paused = !state.paused;
            dom.pause.textContent = state.paused ? "继续" : "暂停";
            dom.status.textContent = state.paused ? "已暂停" : "扫描中";
            log(state.paused ? "⏸️ 已暂停" : "▶️ 继续扫描", "warn");
        }

        function stopScan() {
            state.running = false;
            state.paused = false;
            dom.status.textContent = "已停止";
            dom.pause.textContent = "暂停";
            log("⏹️ 用户停止扫描", "warn");
            if (state.done > 0) finishScan();
            updateUI();
        }

        function saveResults() {
            if (state.results.length === 0) return;
            const content = [
                `# 扫描时间：${new Date().toLocaleString()}`,
                `# 扫描总数：${state.total}｜有效：${state.hitCount}｜保留：${state.results.length}`,
                "",
                ...state.results.map((r, i) => `${r.ip}:${r.port} # ${r.time}ms`)
            ].join("\n");
            
            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `top200_fast_ip_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            log(`💾 已下载 top200_fast_ip.txt (${state.results.length}条)`, "ok");
        }

        dom.start.addEventListener("click", startScan);
        dom.pause.addEventListener("click", pauseScan);
        dom.stop.addEventListener("click", stopScan);
        dom.save.addEventListener("click", saveResults);
    </script>
</body>
</html>
