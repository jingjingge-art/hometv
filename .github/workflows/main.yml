name: 'Daily Job'

on:
  schedule:
    - cron: '0 0 * * *'  # UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'

jobs:
  run_job:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencc-python-reimplemented
        
    - name: Run Python script
      run: python main.py
      
    - name: Upload generated files
      uses: actions/upload-artifact@v4
      with:
        name: generated-files
        path: |
          merged_output.txt
          others_output.txt
          
    - name: Commit changes
      run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add merged_output.txt merged_output.m3u merged_output_simple.txt merged_output_simple.m3u others_output.txt
          git add live.txt live.m3u live_lite.txt live_lite.m3u
          git commit -m ":tada:  AutoUpdate $(date +'%Y%m%d')"

          current_datetime=$(date +"%Y%m%d_%H%M%S")
          # cp merged_output.txt history/"${current_datetime}_merged_output.txt"
          # cp others_output.txt history/"${current_datetime}_others_output.txt"
          # git add history/"${current_datetime}_merged_output.txt"
          # git add history/"${current_datetime}_others_output.txt"
          # git commit -m "Archive file with timestamp"

          # 将归档文件打包zip文件
          zip_filename="history/${current_datetime}_archive_output.zip"
          zip -j "${zip_filename}" merged_output.txt others_output.txt
          git add "${zip_filename}"
          git commit -m "Archive zipfile: ${current_datetime}"
          
    - name: Push changes
      run: |
        # Other scheduled workflows can update main at the same time. Rebase
        # our generated files onto the latest main before retrying the push.
        for attempt in 1 2 3 4 5; do
          git pull --rebase origin main && git push origin HEAD:main && exit 0
          echo "Push attempt ${attempt} failed; retrying in $((attempt * 2)) seconds..."
          sleep $((attempt * 2))
        done
        echo "Unable to push changes after 5 attempts."
        exit 1
