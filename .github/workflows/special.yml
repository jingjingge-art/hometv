name: 'Daily Job(special)'

on:
  schedule:
    - cron: '30 23 * * *'  # UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Daily Job(special)'
        required: true
        default: 'production'

jobs:
  run_job:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
    - name: Run Python script
      run: python assets/special/special.py
          
    - name: Commit changes
      run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add assets/special/special.txt
          git commit -m ":tv:  (special)AutoUpdate $(date -d "+8 hours" +'%Y%m%d')"
          
    - name: Push changes
      run: |
        # Other scheduled workflows can update main at the same time. Rebase
        # our generated files onto the latest main before retrying the push.
        for attempt in 1 2 3 4 5; do
          git pull --rebase origin main && git push origin HEAD:main && exit 0
          echo "Push attempt ${attempt} failed; retrying in $((attempt * 2)) seconds..."
          sleep $((attempt * 2))
        done
        echo "Unable to push changes after 5 attempts."
        exit 1
