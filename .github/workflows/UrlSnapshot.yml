name: 'Daily Job(urlSnapshot)'

on:
  schedule:
    - cron: '00 4 * * 0'  # 每周日 4:00 (UTC) 执行
  workflow_dispatch:
    inputs:
      environment:
        description: 'Daily Job(urlSnapshot)'
        required: true
        default: 'production'

jobs:
  run_job:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run Python script
      run: python assets/snapshot/snapshot.py
          
    - name: Commit changes
      run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # 将归档文件打包zip文件
          current_date=$(date +%Y-%m-%d)
          current_datetime=$(date +"%Y%m%d_%H%M")
          zip_filename="${current_datetime}_UrlSnapshot.zip"
          zip -r "assets/snapshot/${zip_filename}" "assets/snapshot/${current_date}"
          git add "assets/snapshot/${zip_filename}"
          git commit -m "(UrlSnapshot) archive snapshot file"          
          
    - name: Push changes
      run: |
        # Other scheduled workflows can update main at the same time. Rebase
        # our generated files onto the latest main before retrying the push.
        for attempt in 1 2 3 4 5; do
          git pull --rebase origin main && git push origin HEAD:main && exit 0
          echo "Push attempt ${attempt} failed; retrying in $((attempt * 2)) seconds..."
          sleep $((attempt * 2))
        done
        echo "Unable to push changes after 5 attempts."
        exit 1
